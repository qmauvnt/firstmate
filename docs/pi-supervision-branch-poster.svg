<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" aria-labelledby="poster-title poster-desc" role="img" viewBox="0 0 1200 860"><title id="poster-title">Multi-brain agent architecture</title><desc id="poster-desc">One agent. Two branches of attention. Events are commits. A git-graph poster of one fix: routine notes merge with zero turns, and the requested outcome persists visibly before a sequence-keyed processing turn.</desc><defs><pattern id="poster-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path fill="none" stroke="#8CAAE6" stroke-opacity=".06" stroke-width="1" d="M 36 0 L 0 0 0 36"/></pattern></defs><rect width="1200" height="860" fill="#0D1321"/><rect width="1200" height="860" fill="url(#poster-grid)"/><rect width="1199" height="859" x=".5" y=".5" fill="none" stroke="#94B4FF" stroke-opacity=".2" stroke-width="1"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="48" y="56" fill="#E6EDF3" font-size="36" font-weight="700">Multi-brain agent architecture</text><text x="48" y="86" fill="#8CA3C7" font-size="18">One agent. Two branches of attention. Events are commits.</text><text x="1152" y="56" fill="#8CA3C7" fill-opacity=".7" font-size="14" text-anchor="end">fig. 1 - firstmate</text></g><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" transform="translate(0 100)"><title id="mb-title">Multi-brain agent architecture drawn as a git graph: one fix&apos;s lifecycle. The worker finishes and CI runs (routine note), the captain&apos;s merge-when-green instruction is cherry-picked down, a flaky test is rerun (routine note), and when CI goes green the supervision brain persists the exact requested outcome visibly before main processes it.</title><defs><marker id="ah-cyan" markerHeight="7.5" markerWidth="7.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#56C8FF" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ah-amber" markerHeight="7.5" markerWidth="7.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#FFB454" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ah-time" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8CA3C7" d="M 0 0 L 10 5 L 0 10 z"/></marker><linearGradient id="merge-up" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#56C8FF"/><stop offset="1" stop-color="#FFB454"/></linearGradient></defs><line x1="280" x2="1140" y1="210" y2="210" stroke="#FFB454" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#56C8FF" stroke-linecap="round" stroke-width="3" d="M 310 221 C 310 380, 330 490, 420 490"/><line x1="420" x2="1140" y1="490" y2="490" stroke="#56C8FF" stroke-linecap="round" stroke-width="3"/><text x="64" y="200" fill="#FFB454" font-size="24" font-weight="700">MAIN SESSION</text><text x="64" y="230" fill="#E6EDF3" font-size="16" opacity=".6">talks with the captain</text><text x="64" y="480" fill="#56C8FF" font-size="24" font-weight="700">SUPERVISION SESSION</text><text x="64" y="510" fill="#E6EDF3" font-size="16" opacity=".6">handles the routine,</text><text x="64" y="534" fill="#E6EDF3" font-size="16" opacity=".6">decides routine note or exact captain entry</text><path id="arc-quiet-1" fill="none" stroke="#56C8FF" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="2.5" marker-end="url(#ah-cyan)" d="M 460 479 C 490 400, 520 300, 545 221" opacity=".6"/><path id="arc-cherry" fill="none" stroke="#FFB454" stroke-dasharray="2 8" stroke-linecap="round" stroke-width="2.5" marker-end="url(#ah-amber)" d="M 620 221 C 645 300, 675 400, 700 479" opacity=".8"/><path id="arc-quiet-2" fill="none" stroke="#56C8FF" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="2.5" marker-end="url(#ah-cyan)" d="M 760 479 C 785 400, 810 300, 830 221" opacity=".6"/><path id="arc-wake" fill="none" stroke="url(#merge-up)" stroke-linecap="round" stroke-width="4" marker-end="url(#ah-amber)" d="M 940 479 C 975 410, 1015 300, 1038 226"/><g id="chip-quiet-1"><title>A silent note: nothing needs the captain yet</title><rect width="230" height="36" x="385" y="312" fill="#0D1321" stroke="#56C8FF" stroke-width="1.5" opacity=".95" rx="6"/><text x="500" y="336" fill="#B9E5FF" font-size="16" text-anchor="middle">“PR opened, CI running”</text></g><g id="chip-cherry"><title>The captain&apos;s own instruction, cherry-picked down as context</title><rect width="260" height="36" x="530" y="377" fill="#0D1321" stroke="#FFB454" stroke-width="1.5" opacity=".95" rx="6"/><text x="660" y="401" fill="#FFD9A0" font-size="16" text-anchor="middle">you: “merge when CI green”</text></g><g id="chip-quiet-2"><title>A silent note: the supervision brain already fixed it</title><rect width="270" height="36" x="665" y="272" fill="#0D1321" stroke="#56C8FF" stroke-width="1.5" opacity=".95" rx="6"/><text x="800" y="296" fill="#B9E5FF" font-size="16" text-anchor="middle">“flaky test: reran, passed”</text></g><g id="chip-wake"><title>The outcome the captain asked for: this exact entry persists visibly</title><rect width="250" height="38" x="865" y="342" fill="#0D1321" stroke="#FFB454" stroke-width="2" rx="6"/><text x="990" y="367" fill="#FFB454" font-size="17" font-weight="600" text-anchor="middle">“merged: your fix is in”</text></g><g id="main-commits"><title>The captain&apos;s conversation, commit by commit</title><circle cx="310" cy="210" r="11" fill="#0D1321" stroke="#FFB454" stroke-width="3.5"/><circle cx="620" cy="210" r="11" fill="#0D1321" stroke="#FFB454" stroke-width="3.5"/><circle cx="1120" cy="210" r="11" fill="#0D1321" stroke="#FFB454" stroke-width="3.5"/></g><g id="silent-landings"><title>Notes merged silently into the conversation: no one is woken</title><circle cx="545" cy="210" r="7" fill="#0D1321" stroke="#56C8FF" stroke-width="3" opacity=".85"/><circle cx="830" cy="210" r="7" fill="#0D1321" stroke="#56C8FF" stroke-width="3" opacity=".85"/></g><text x="545" y="174" fill="#56C8FF" font-size="13.5" opacity=".8" text-anchor="middle">silent merge. zero turns</text><text x="830" y="174" fill="#56C8FF" font-size="13.5" opacity=".8" text-anchor="middle">silent merge. zero turns</text><g id="merge-commit"><title>Merged and surfaced: the exact captain outcome persists visibly once</title><circle cx="1040" cy="210" r="13" fill="#FFB454"/><circle cx="1040" cy="210" r="21" fill="none" stroke="#FFB454" stroke-width="1.5" opacity=".5"/><path fill="none" stroke="#FFB454" stroke-linecap="round" stroke-width="2.5" d="M 1019 189 A 30 30 0 0 1 1061 189" opacity=".8"/><path fill="none" stroke="#FFB454" stroke-linecap="round" stroke-width="2.5" d="M 1011 181 A 41 41 0 0 1 1069 181" opacity=".5"/></g><text x="1040" y="148" fill="#FFB454" font-size="18" font-weight="700" text-anchor="middle">persists visibly</text><g id="branch-commits"><title>One fix&apos;s routine events, handled on the supervision brain</title><circle cx="460" cy="490" r="10" fill="#0D1321" stroke="#56C8FF" stroke-width="3.5"/><circle cx="760" cy="490" r="10" fill="#0D1321" stroke="#56C8FF" stroke-width="3.5"/><circle cx="940" cy="490" r="10" fill="#0D1321" stroke="#56C8FF" stroke-width="3.5"/></g><circle cx="700" cy="490" r="8" fill="#0D1321" stroke="#FFB454" stroke-width="3"/><line x1="460" x2="460" y1="503" y2="530" stroke="#56C8FF" stroke-width="1.5" opacity=".35"/><text x="460" y="554" fill="#E6EDF3" font-size="16" opacity=".75" text-anchor="middle">worker finishes the fix</text><line x1="760" x2="760" y1="503" y2="530" stroke="#56C8FF" stroke-width="1.5" opacity=".35"/><text x="760" y="554" fill="#E6EDF3" font-size="16" opacity=".75" text-anchor="middle">a flaky test fails</text><line x1="940" x2="940" y1="503" y2="530" stroke="#56C8FF" stroke-width="1.5" opacity=".35"/><text x="940" y="554" fill="#E6EDF3" font-size="16" opacity=".75" text-anchor="middle">CI goes green</text><line x1="1010" x2="1110" y1="660" y2="660" stroke="#8CA3C7" stroke-linecap="round" stroke-width="2" marker-end="url(#ah-time)"/><text x="1128" y="665" fill="#8CA3C7" font-size="15">time</text><text x="560" y="700" fill="#E6EDF3" font-size="18" opacity=".6" text-anchor="middle">Routine outcomes stay quiet. What needs you persists visibly and exactly.</text></g></svg>